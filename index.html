<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tá.ie</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f4ee;
    color: #2d2a24;
  }

  header {
    flex: 0 0 auto;
    padding: 18px 20px 14px;
    background: #fbf8f1;
    border-bottom: 1px solid #e5decf;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: 0.5px;
    color: #174a2e;
  }

  header p {
    margin: 4px 0 0;
    font-size: 14px;
    color: #6f6757;
  }

  main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  #map {
    flex: 1 1 auto;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }

  #map svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  #map-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #7a2e2e;
    font-size: 15px;
    line-height: 1.5;
    background: #f7f4ee;
  }

  #map-error p {
    max-width: 480px;
  }

  #info {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 340px;
    background: #fffdf7;
    border-left: 1px solid #e5decf;
    box-shadow: -6px 0 14px rgba(90, 75, 40, 0.12);
    overflow-y: auto;
    padding: 26px 24px;
    z-index: 10;
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.28s ease, visibility 0.28s;
  }

  #info.open {
    transform: translateX(0);
    visibility: visible;
  }

  .panel-title {
    margin: 0 0 4px;
    font-size: 21px;
    line-height: 1.25;
  }

  .panel-en-name {
    margin: 0 0 20px;
    font-size: 12.5px;
    color: #8a806c;
  }

  .panel-section {
    margin: 0 0 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a806c;
    border-bottom: 1px solid #ece5d6;
    padding-bottom: 6px;
  }

  .panel-empty {
    margin: 0;
    color: #8a806c;
    font-size: 14px;
    font-style: italic;
  }

  .panel-note {
    margin: 0;
    color: #8a806c;
    font-size: 14px;
    font-style: italic;
  }

  .group-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .group-item {
    margin: 0 0 10px;
    padding: 12px 14px;
    border: 1px solid #e5decf;
    border-radius: 10px;
    background: #fbf8f1;
  }

  .group-item:last-child {
    margin-bottom: 0;
  }

  .group-item strong {
    display: block;
    font-size: 14.5px;
    line-height: 1.3;
  }

  .group-note {
    margin: 4px 0 0;
    font-size: 13px;
    color: #6f6757;
    line-height: 1.45;
  }

  .group-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #174a2e;
    text-decoration: none;
    border-bottom: 1px solid #9ab894;
  }

  .group-link:hover {
    color: #0f331f;
    border-bottom-color: #174a2e;
  }

  #add-link {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 5;
    padding: 9px 14px;
    background: #174a2e;
    color: #f7f4ee;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(23, 74, 46, 0.35);
    transition: background 0.15s ease, transform 0.15s ease;
  }

  #add-link:hover {
    background: #123c25;
    transform: translateY(-1px);
  }

  #globe-btn {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 20;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #174a2e;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(23, 74, 46, 0.35);
    transition: background 0.15s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  #globe-btn:hover {
    background: #123c25;
    transform: translateY(-1px);
  }

  #globe-btn:focus-visible {
    outline: 2px solid #9ab894;
    outline-offset: 2px;
  }

  #globe-btn svg {
    width: 22px;
    height: 22px;
  }

  #globe-spin {
    animation: globe-spin 6s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes globe-spin {
    to { transform: rotate(-360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    #globe-spin {
      animation: none;
    }
  }

  #papers-widget {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 5;
    width: 260px;
    max-width: calc(100vw - 28px);
    max-height: 46vh;
    background: #fffdf7;
    border: 1px solid #e5decf;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(90, 75, 40, 0.12);
    padding: 14px 14px 12px;
    overflow-y: auto;
  }

  #papers-widget h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    line-height: 1.3;
    color: #174a2e;
    border-bottom: 1px solid #ece5d6;
    padding-bottom: 8px;
  }

  .paper-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .paper-item {
    margin: 0 0 8px;
  }

  .paper-item:last-child {
    margin-bottom: 0;
  }

  .paper-item a {
    display: block;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: #2d2a24;
    text-decoration: none;
  }

  .paper-item a:hover {
    color: #174a2e;
    text-decoration: underline;
  }

  .paper-meta {
    margin: 3px 0 0;
    font-size: 11.5px;
    color: #8a806c;
  }

  .paper-empty {
    margin: 0;
    font-size: 13px;
    font-style: italic;
    color: #8a806c;
  }

  @media (max-width: 640px) {
    #info {
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;
      width: 100%;
      max-height: 70vh;
      border-left: none;
      border-top: 1px solid #e5decf;
      box-shadow: 0 -6px 14px rgba(90, 75, 40, 0.12);
      transform: translateY(105%);
    }
  }

  .county {
    cursor: pointer;
    fill: var(--fill, #d7e8c8);
    stroke: #ffffff;
    stroke-width: 1.2px;
    stroke-linejoin: round;
    transition: transform 0.15s ease, filter 0.15s ease, fill 0.15s ease;
    transform-box: fill-box;
    transform-origin: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .county.selected {
    fill: #174a2e;
    transform: scale(1.03);
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.28));
  }

  @media (hover: hover) {
    .county.active {
      transform: scale(1.05);
      filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.3));
    }
  }

  #map-layer {
    transition: transform 0.28s ease;
  }

  @media (min-width: 641px) {
    body.show-panel #map-layer {
      transform: translateX(-170px);
    }
  }

  #tooltip {
    position: fixed;
    display: none;
    pointer-events: none;
    z-index: 100;
    background: rgba(40, 43, 34, 0.93);
    color: #f7f4ee;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 6px;
    box-shadow: 0 2px 7px rgba(0, 0, 0, 0.25);
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Tá.ie</h1>
  <p>Ag tacú le hÉire Aontaithe</p>
</header>

<main>
  <div id="map">
    <svg id="ireland" role="img" aria-label="Léarscáil de chontaetha na hÉireann"></svg>
    <div id="papers-widget">
      <h2>The Economics of a united Ireland</h2>
      <ul class="paper-list" id="paper-list"></ul>
    </div>
    <div id="map-error"></div>
  </div>
  <aside id="info" aria-live="polite"></aside>
</main>

<a id="add-link" href="mailto:info@fabricationbelfast.com?subject=Add%20group%2Findividual">Add group/individual</a>

<button id="globe-btn" type="button" aria-label="Idirnáisiúnta — international endorsements">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="globe-ocean" cx="35%" cy="32%" r="78%">
        <stop offset="0%" stop-color="#8fd2ec"/>
        <stop offset="100%" stop-color="#2f7fae"/>
      </radialGradient>
      <clipPath id="globe-clip">
        <circle cx="12" cy="12" r="8.6"/>
      </clipPath>
    </defs>
    <circle cx="12" cy="12" r="9" fill="url(#globe-ocean)"/>
    <g clip-path="url(#globe-clip)">
      <g id="globe-spin">
        <path d="M4.1 4.4 C5.3 3.4 8.0 3.3 9.3 4.2 C10.2 4.8 10.3 5.9 10.6 6.9 C10.9 7.9 10.7 9.0 11.0 10.0 C11.3 11.0 11.2 12.1 10.9 13.1 C10.6 14.0 10.0 14.8 9.6 15.7 C9.3 16.4 8.9 17.2 8.3 17.7 C7.6 18.4 6.7 18.5 5.9 18.1 C5.2 17.7 4.9 17.0 4.6 16.3 C4.3 15.5 4.0 14.8 3.9 13.9 C3.8 13.1 3.7 12.3 3.8 11.5 C3.9 10.7 3.9 9.9 4.0 9.1 C4.1 8.3 3.9 7.5 4.1 6.7 C4.2 5.9 4.1 5.1 4.1 4.4 Z" fill="#6fa75a"/>
        <path d="M5.0 3.3 C5.7 3.0 6.6 3.2 6.8 3.8 C7.0 4.4 6.6 5.0 5.9 5.0 C5.3 5.0 4.8 4.3 5.0 3.3 Z" fill="#6fa75a"/>
        <path d="M10.7 4.2 C11.1 3.9 11.6 4.1 11.6 4.5 C11.7 4.9 11.4 5.3 10.9 5.3 C10.6 5.3 10.4 4.7 10.7 4.2 Z" fill="#6fa75a"/>
        <path d="M12.1 3.6 C12.6 3.4 13.1 3.8 13.0 4.3 C13.0 4.9 13.6 5.3 13.5 5.9 C13.4 6.6 12.8 7.0 12.3 6.7 C11.8 6.3 11.8 5.4 12.0 4.8 C12.1 4.4 11.8 4.0 12.1 3.6 Z" fill="#6fa75a"/>
        <path d="M13.3 4.1 C14.4 3.7 15.8 3.9 16.5 4.6 C17.1 5.3 17.1 6.3 16.8 7.1 C16.5 7.9 15.8 8.5 15.0 8.3 C14.2 8.1 13.6 7.5 13.3 6.8 C13.0 6.1 12.9 5.3 13.1 4.7 C13.2 4.4 13.2 4.3 13.3 4.1 Z" fill="#6fa75a"/>
        <path d="M13.6 8.6 C14.9 8.2 16.3 8.8 16.9 9.9 C17.5 11.0 18.2 12.2 18.1 13.5 C18.0 14.8 18.1 16.1 17.4 17.2 C16.7 18.3 15.5 18.9 14.5 18.3 C13.5 17.7 13.5 16.6 13.2 15.6 C12.9 14.6 12.7 13.5 12.9 12.4 C13.0 11.4 12.8 10.2 13.1 9.3 C13.3 8.9 13.4 8.8 13.6 8.6 Z" fill="#6fa75a"/>
      </g>
    </g>
    <circle cx="12" cy="12" r="9" fill="none" stroke="#1a5f8a" stroke-width="1.2"/>
    <ellipse cx="7.6" cy="5.8" rx="4.6" ry="3" fill="rgba(255,255,255,0.35)" transform="rotate(-40 7.6 5.8)"/>
  </svg>
</button>

<div id="tooltip" role="tooltip"></div>

<script>
(function () {
  'use strict';

  var mapEl = document.getElementById('map');
  var svg = d3.select('#ireland');
  var infoEl = document.getElementById('info');
  var tooltipEl = document.getElementById('tooltip');
  var errorEl = document.getElementById('map-error');
  var paperListEl = document.getElementById('paper-list');
  var bodyEl = document.body;

  var stats = null;
  var geojson = null;
  var projection = null;
  var pathGen = null;
  var mapLayer = null;

  var tints = ['#e2ecd2', '#d8e8ca', '#d3e4c4', '#dceacf', '#cfe2c2'];

  function countyKey(props) {
    return props.NAME_GA.toLowerCase().replace(/\s+/g, '_');
  }

  var nominativeNames = {
    'contae_an_chabháin': 'Cabhán',
    'contae_an_chláir': 'Clár',
    'contae_an_dún': 'Dún',
    'contae_an_longfoirt': 'Longfort',
    'contae_aontroma': 'Aontroim',
    'contae_ard_mhacha': 'Ard Mhacha',
    'contae_cheatharlach': 'Ceatharlach',
    'contae_chiarraí': 'Ciarraí',
    'contae_chill_chainnigh': 'Cill Chainnigh',
    'contae_chill_dara': 'Cill Dara',
    'contae_chill_mhantáin': 'Cill Mhantáin',
    'contae_chorcaigh': 'Corcaigh',
    'contae_dhoire': 'Doire',
    'contae_dhún_na_ngall': 'Dún na nGall',
    'contae_fhear_manach': 'Fear Manach',
    'contae_laoise': 'Laois',
    'contae_liatroma': 'Liatroim',
    'contae_loch_garman': 'Loch Garman',
    'contae_luimnigh': 'Luimneach',
    'contae_lú': 'Lú',
    'contae_mhaigh_eo': 'Maigh Eo',
    'contae_mhuineacháin': 'Muineachán',
    'contae_na_gaillimhe': 'Gaillimh',
    'contae_na_hiarmhí': 'Iarmhí',
    'contae_na_mí': 'Mí',
    'contae_phort_láirge': 'Port Láirge',
    'contae_ros_comáin': 'Ros Comáin',
    'contae_shligigh': 'Sligeach',
    'contae_thiobraid_árann': 'Tiobraid Árann',
    'contae_thír_eoghain': 'Tír Eoghain',
    'contae_uíbh_fhailí': 'Uíbh Fhailí',
    'contae_átha_cliath': 'Áth Cliath'
  };

  function countyDisplay(props) {
    var key = countyKey(props);
    return nominativeNames[key] || String(props.NAME_GA).replace(/^Contae\s+/, '');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isSafeUrl(value) {
    return typeof value === 'string' && /^https?:\/\//i.test(value);
  }

  function showError(message) {
    svg.style('display', 'none');
    errorEl.style.display = 'flex';
    errorEl.innerHTML = '<p>' + escapeHtml(message) + '</p>';
  }

  function renderPapers(papers) {
    if (!papers || papers.length === 0) {
      paperListEl.innerHTML = '<li class="paper-empty">Níl aon pháipéar curtha leis fós.</li>';
      return;
    }
    var html = '';
    papers.forEach(function (p) {
      html += '<li class="paper-item">';
      if (isSafeUrl(p.url)) {
        html += '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener">' +
          escapeHtml(p.title) + '</a>';
      } else {
        html += '<a>' + escapeHtml(p.title) + '</a>';
      }
      var meta = [];
      if (p.author) meta.push(p.author);
      if (p.date) meta.push(p.date);
      if (meta.length) html += '<p class="paper-meta">' + escapeHtml(meta.join(' · ')) + '</p>';
      html += '</li>';
    });
    paperListEl.innerHTML = html;
  }

  function fitAndDraw() {
    var width = mapEl.clientWidth || window.innerWidth;
    var height = mapEl.clientHeight || window.innerHeight;
    var pad = 60;

    projection = d3.geoConicEqualArea().parallels([51.5, 55])
      .fitExtent([[pad, pad], [width - pad, height - pad]], geojson);
    pathGen = d3.geoPath(projection);

    svg.attr('width', width).attr('height', height);
    mapLayer.selectAll('path.county').attr('d', pathGen);
  }

  function renderMap() {
    svg.style('display', null);
    errorEl.style.display = 'none';
    errorEl.innerHTML = '';

    mapLayer = svg.append('g').attr('id', 'map-layer');

    var counties = mapLayer.selectAll('path.county')
      .data(geojson.features)
      .join('path')
      .attr('class', 'county')
      .attr('data-county', function (d) { return countyDisplay(d.properties); })
      .attr('data-key', function (d) { return countyKey(d.properties); })
      .attr('aria-label', function (d) { return countyDisplay(d.properties); })
      .style('--fill', function (d, i) { return tints[i % tints.length]; });

    counties.on('click', countyClick);

    if (window.matchMedia('(hover: hover)').matches) {
      counties
        .on('pointerenter', hoverIn)
        .on('pointermove', tooltipMove)
        .on('pointerleave', hoverOut);
    }

    svg.on('click', function () { clearSelection(); });

    fitAndDraw();
  }

  function hoverIn(event, d) {
    d3.select(this).classed('active', true);
    this.parentNode.appendChild(this);
    tooltipEl.textContent = countyDisplay(d.properties);
    tooltipEl.style.display = 'block';
    positionTooltip(event);
  }

  function tooltipMove(event) {
    positionTooltip(event);
  }

  function hoverOut() {
    d3.select(this).classed('active', false);
    tooltipEl.style.display = 'none';
  }

  function positionTooltip(event) {
    var pad = 14;
    var x = event.clientX + pad;
    var y = event.clientY + pad;
    var tw = tooltipEl.offsetWidth;
    var th = tooltipEl.offsetHeight;
    if (x + tw > window.innerWidth - 4) x = event.clientX - tw - pad;
    if (y + th > window.innerHeight - 4) y = event.clientY - th - pad;
    tooltipEl.style.left = x + 'px';
    tooltipEl.style.top = y + 'px';
  }

  function countyClick(event, d) {
    event.stopPropagation();
    var props = d.properties;
    var key = countyKey(props);
    selectCounty(key, props, stats ? stats[key] : null);
  }

  function selectCounty(key, props, entry) {
    internationalOpen = false;
    mapLayer.selectAll('path.county').classed('selected', false);

    var selected = mapLayer.selectAll('path.county')
      .filter(function () { return this.getAttribute('data-key') === key; });

    selected.classed('selected', true);
    var node = selected.node();
    if (node && node.parentNode) node.parentNode.appendChild(node);

    renderPanel(props, entry);
    showPanel();
  }

  function renderPanel(props, entry) {
    var hasEntry = !!entry;
    var nameEn = hasEntry && entry.name_en ? entry.name_en : props.NAME_EN;
    var nameGa = hasEntry && entry.name_ga ? entry.name_ga : countyDisplay(props);
    var groups = hasEntry ? (entry.groups || []) : null;

    var html = '<h2 class="panel-title">' + escapeHtml(nameGa) + '</h2>';
    html += '<p class="panel-en-name">' + escapeHtml(nameEn) + '</p>';
    html += '<h3 class="panel-section">Grúpaí agus Daoine</h3>';

    if (!hasEntry) {
      html += '<p class="panel-note">Níl aon iontráil sonraí don chontae seo fós.</p>';
    } else if (groups.length === 0) {
      html += '<p class="panel-empty">Níl grúpaí ná daoine curtha leis fós.</p>';
    } else {
      html += '<ul class="group-list">';
      groups.forEach(function (g) {
        html += '<li class="group-item"><strong>' + escapeHtml(g.name) + '</strong>';
        if (g.note) html += '<p class="group-note">' + escapeHtml(g.note) + '</p>';
        if (isSafeUrl(g.url)) {
          html += '<a class="group-link" href="' + escapeHtml(g.url) +
            '" target="_blank" rel="noopener">Foinse</a>';
        }
        html += '</li>';
      });
      html += '</ul>';
    }

    infoEl.innerHTML = html;
  }

  function showPanel() {
    infoEl.classList.add('open');
    bodyEl.classList.add('show-panel');
  }

  function hidePanel() {
    infoEl.classList.remove('open');
    bodyEl.classList.remove('show-panel');
  }

  function clearSelection() {
    internationalOpen = false;
    mapLayer.selectAll('path.county').classed('selected', false);
    infoEl.innerHTML = '';
    hidePanel();
  }

  var internationalOpen = false;
  var globeBtn = document.getElementById('globe-btn');

  function showInternational() {
    if (internationalOpen) {
      clearSelection();
      return;
    }
    if (!stats || !stats.idirnáisiúnta) return;
    internationalOpen = true;
    if (mapLayer) mapLayer.selectAll('path.county').classed('selected', false);
    renderPanel({}, stats.idirnáisiúnta);
    showPanel();
  }

  globeBtn.addEventListener('click', showInternational);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSelection();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (geojson) fitAndDraw();
    }, 150);
  });

  Promise.all([
    d3.json('./counties.geojson'),
    d3.json('./county-data.json')
  ]).then(function (results) {
    geojson = results[0];
    stats = results[1] || {};
    renderMap();
    renderPapers(stats.papers);
    console.log('Ireland map loaded:', geojson.features.length, 'counties;',
      Object.keys(stats).length, 'data entries');
  }).catch(function (err) {
    console.error('Failed to load map data:', err);
    showError('Couldn\'t load the map data. Make sure counties.geojson and ' +
      'county-data.json are served from the same directory as this page ' +
      'then refresh.');
  });
})();
</script>
